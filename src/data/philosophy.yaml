- id: main
  heading: Philosophy
  principles:
    - title: The Pareto Principle
      body:
        - text: I believe 20% of things matter most, which makes it possible to represent everything in the world through abstraction.
          children:
            - e.g. work, code, writing, people
        - text: We can also use this principle to identify if we correctly understand something.
          children:
            - If we cannot explain an idea in a single sentence, we probably do not understand it well enough. 
            - If an action requires many different reasons to justify it, we may not have identified the real issue.
    - title: The Power of Compounding
      body: 
        - I value what endures, accumulates, and transfers to other fields. This would make the compounding effect.
        - This approach might look slow at the cold start, but it can be extremely powerful in the long term.
        - text: e.g. 
          children:
            - Writing, Reading, Speaking
            - Logical thinking, First principle thinking
            - Engineering skills
            - Mathematics, Physics

    - title: Engineer mindset
      body:
        - text: To me, engineering is essentially optimization, and the engineer mindset refers to the will to consider the possiblity of optimization on anything. 
          children:
            - One of the most important optimization is about cognitive ability. 
            - We can maximize the arithmetic intensity of our brain by good abstraction or automation. 
        - This mindset can be applied to any kind of work to accelerate process.
